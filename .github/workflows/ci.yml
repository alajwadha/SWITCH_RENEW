name: Validate workbench
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned tutorial and core sources
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          p=pathlib.Path('.sources');p.mkdir(exist_ok=True)
          for name,meta in json.load(open('sources.lock.json')).items():
              if name=='kenya':continue
              subprocess.run(['git','clone','--filter=blob:none','--no-checkout',meta['url'],str(p/name)],check=True)
              subprocess.run(['git','-C',str(p/name),'checkout','--detach',meta['commit']],check=True)
          PY
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-deps -e .sources/switch
          npm ci --no-audit --no-fund
      - name: Build production interface
        run: npm run build
      - name: Verify editor state and atlas comparisons
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Verify model parity, persistence and backup recovery
        run: python -m pytest -q
